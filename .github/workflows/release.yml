name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RUST_VERSION: "1.88.0"
  WASM_PACK_VERSION: "0.13.1"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"

      - name: Install wasm-pack
        run: cargo install wasm-pack --version "${WASM_PACK_VERSION}" --locked

      - name: Build web package
        run: wasm-pack build --release --target web --out-dir pkg

      - name: Smoke test
        run: npm test

      - name: Stage release assets
        run: |
          mkdir -p release
          cp pkg/jpreprocess_wasm_bg.wasm release/jpreprocess_wasm_bg.wasm
          cp pkg/jpreprocess_wasm.js release/jpreprocess_wasm.js
          cp pkg/jpreprocess_wasm.d.ts release/jpreprocess_wasm.d.ts
          gzip -9 -n -c release/jpreprocess_wasm_bg.wasm \
            > release/jpreprocess_wasm_bg.wasm.gz
          gzip -t release/jpreprocess_wasm_bg.wasm.gz
          gzip -dc release/jpreprocess_wasm_bg.wasm.gz \
            | cmp - release/jpreprocess_wasm_bg.wasm
          sha256sum release/jpreprocess_wasm_bg.wasm release/jpreprocess_wasm_bg.wasm.gz release/jpreprocess_wasm.js release/jpreprocess_wasm.d.ts > release/SHA256SUMS

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/jpreprocess_wasm_bg.wasm \
            release/jpreprocess_wasm_bg.wasm.gz \
            release/jpreprocess_wasm.js \
            release/jpreprocess_wasm.d.ts \
            release/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
